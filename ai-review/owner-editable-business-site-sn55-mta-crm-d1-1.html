*{

}

html{
  scroll-behavior:smooth
}

body{
  margin:0;

  color:var(--charcoal);

  font-size:14px;
  line-height:1.55
}

h1,h2,h3,.font-display{
  font-family:"Plus Jakarta Sans",Inter,sans-serif;

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-track{
  background:#E3E3DD;
  border-radius:99px
}

::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#04E1AB,#10AE9E);
  border-radius:99px;
  border:1px solid #E3E3DD
}

::-webkit-scrollbar-button{
  display:none;
  width:0;
  height:0
}

.thin-scroll::-webkit-scrollbar{
  width:5px
}

button{
  transition:transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease
}

button:active{
  transform:scale(.98)
}

.card{
  border:1px solid rgba(0,0,0,.08);
  border-radius:22px;
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.04)
}

.card-hover:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 36px rgba(5,7,56,.09)
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(12px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes pulseDot{
  0%,100%{
    box-shadow:0 0 0 0 rgba(16,174,158,.35)
  }

  50%{
    box-shadow:0 0 0 7px rgba(16,174,158,0)
  }
}

@keyframes slideIn{
  from{
    transform:translateX(100%)
  }

  to{
    transform:translateX(0)
  }
}

@keyframes popIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(8px)
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0)
  }
}

@keyframes shimmer{
  0%{
    background-position:-400px 0
  }

  100%{
    background-position:400px 0
  }
}

.animate-fade{
  animation:fadeUp .45s ease both
}

.animate-pop{
  animation:popIn .22s ease both
}

.animate-drawer{
  animation:slideIn .28s cubic-bezier(.2,.8,.2,1) both
}

.skeleton{
  background:linear-gradient(90deg,#eee 25%,#f8f8f8 50%,#eee 75%);
  background-size:800px 100%;
  animation:shimmer 1.2s infinite
}

.pulse-dot{
  animation:pulseDot 2s infinite
}

  position:relative;
  flex:none;
  cursor:pointer;

  content:"";
  position:absolute;

  background:white;
  left:3px;
  top:3px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:.2s

.switch.on{

  left:23px

  background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
}

.hover\:text-\[\#291F1B\]:hover{
  --tw-text-opacity: 1;
  color: rgb(41 31 27 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

@media (min-width: 768px){
  .md\:right-6{
    right: 1.5rem;
  }

  .md\:block{
    display: block;
  }

  .md\:flex{
    display: flex;
  }

  .md\:hidden{
    display: none;
  }

  .md\:h-14{
    height: 3.5rem;
  }

  .md\:min-h-\[104px\]{
    min-height: 104px;
  }

  .md\:w-14{
    width: 3.5rem;
  }

  .md\:w-\[264px\]{
    width: 264px;
  }

  .md\:w-\[76px\]{
    width: 76px;
  }

  .md\:w-auto{
    width: auto;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1\.3fr_\.7fr\]{
    grid-template-columns: 1.3fr .7fr;
  }

  .md\:gap-2{
    gap: 0.5rem;
  }

  .md\:gap-3{
    gap: 0.75rem;
  }

  .md\:gap-4{
    gap: 1rem;
  }

  .md\:p-5{
    padding: 1.25rem;
  }

  .md\:p-6{
    padding: 1.5rem;
  }

  .md\:p-7{
    padding: 1.75rem;
  }

  .md\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .md\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .md\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:py-7{
    padding-top: 1.75rem;
    padding-bottom: 1.75rem;
  }

  .md\:text-\[17px\]{
    font-size: 17px;
  }

  .md\:text-\[28px\]{
    font-size: 28px;
  }

  .md\:text-\[42px\]{
    font-size: 42px;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-4{
    grid-column: span 4 / span 4;
  }

  .lg\:block{
    display: block;
  }

  .lg\:inline{
    display: inline;
  }

  .lg\:hidden{
    display: none;
  }

  .lg\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }
}

@media (min-width: 1280px){
  .xl\:sticky{
    position: sticky;
  }

  .xl\:top-\[84px\]{
    top: 84px;
  }

  .xl\:col-span-4{
    grid-column: span 4 / span 4;
  }

  .xl\:col-span-8{
    grid-column: span 8 / span 8;
  }

  .xl\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }
}
